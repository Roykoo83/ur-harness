# UR Harness 설정 — 이 파일을 harness.yaml 로 복사해 값을 채운다
#
#   cp config/harness.example.yaml config/harness.yaml
#
# harness.yaml 은 .gitignore 로 제외된다. 실제 값은 저장소에 들어가지 않는다.
# 기존에 ~/.nworks/config.json 을 쓰고 있었다면 그대로 둬도 된다 — 로더가 함께 읽는다.

# ─────────────────────────────────────────────────────────────────────────
# org — 조직 자산. 담당자가 바뀌어도 그대로다
# ─────────────────────────────────────────────────────────────────────────
org:
  name: "<조직 표시 이름>"              # 문서·브리핑에 쓰이는 이름
  domain: "<example.org>"              # 조직 메일 도메인
  wiki_base: "https://<org>.atlassian.net"   # 사내 위키. 안 쓰면 비운다

  drives:
    ssot:
      name: "<SSOT_DRIVE_NAME>"        # 정본 공유 드라이브 이름
      id: "<SSOT_DRIVE_ID>"            # 공유 드라이브 ID (0A… 로 시작)
      remote_ro: "SSOT_ro"             # rclone 원격 이름 (읽기 전용)
      remote_rw: "SSOT_rw"             # rclone 원격 이름 (쓰기)
    source:
      name: "<SOURCE_DRIVE_NAME>"      # 원천 자료 드라이브 이름
      id: "<SOURCE_DRIVE_ID>"
      remote: "gdrive"

  accounts:
    bot: "<bot>@<example.org>"         # 메일·메신저 수집용 봇 계정
    service: "<sa>@<project>.iam.gserviceaccount.com"   # 서비스계정

# ─────────────────────────────────────────────────────────────────────────
# operator — 담당자와 실행 환경. **이관 때 여기만 고친다**
# ─────────────────────────────────────────────────────────────────────────
operator:
  account: "<operator>@<example.org>"  # Drive·메일 OAuth 주체
  name: "<표시 이름>"                   # 작업로그 폴더명에 쓰인다
  workspace: "~/ur-harness-work"       # 산출물·상태·로그가 쌓이는 곳
  mount_root: ""                       # DriveFS 마운트를 쓸 때만. 안 쓰면 빈 값

# ─────────────────────────────────────────────────────────────────────────
# members — 구성원 표시 이름. 문서·대시보드에서 담당 표기에 쓰인다
#           순서가 코드의 MEMBER_A·B·C… 에 대응한다
# ─────────────────────────────────────────────────────────────────────────
members: []
# - "<구성원 1>"
# - "<구성원 2>"

# ─────────────────────────────────────────────────────────────────────────
# channels — 메신저 채널
# ─────────────────────────────────────────────────────────────────────────
channels:
  dept: "<DEPT_CHANNEL_ID>"            # 부서방 (브리핑 발송)
  archive: []                          # 아카이빙할 채널 ID 목록

# ─────────────────────────────────────────────────────────────────────────
# ssot — 정본 안의 경로. 조직 폴더 구조에 맞춘다
# ─────────────────────────────────────────────────────────────────────────
ssot:
  dept_root: "<부서 폴더>"              # 예: 10_연구기획사업부

  # 부서 수신 메일로 볼 주소. 자동 포워딩이 헤더에 대표주소를 남기지 않는 경우가 있어
  # (게이트웨이가 숨긴다) 대표주소만으로는 걸러지지 않는다 — 부서원 주소를 함께 적는다.
  # 비워 두면 거르지 않고 전부 수집한다.
  dept_addresses: []
  #   - "research@example.org"
  #   - "someone@example.org"
  paths:
    tasks: "<부서 폴더>/10_과제"
    mail: "<부서 폴더>/40_커뮤니케이션/메일"
    messenger: "<부서 폴더>/40_커뮤니케이션/메신저"
    dashboards: "<부서 폴더>/50_대시보드"
    calendar: "00_공통/20_일정"
    ontology: "00_공통/50_온톨로지"
    system: "_시스템"
    norms: "50_도구상자/00_규범"

# ─────────────────────────────────────────────────────────────────────────
# owners — 자동 게시에서 제외하거나 담당을 표시할 대상
#          사람이 바뀌면 갱신한다
# ─────────────────────────────────────────────────────────────────────────
owners: []
# - board: "<보드 이름>"
#   owner: "<표시 이름>"
#   auto: false              # false = 자동 게시 대상에서 뺀다

# ─────────────────────────────────────────────────────────────────────────
# watchdog — 감시 예외
# ─────────────────────────────────────────────────────────────────────────
watchdog:
  dup_allow: []              # 「이름 2」 꼴이지만 실제 파일명인 것 (전체 경로)
  mount_lag_minutes: 360     # 이보다 오래된 캐시는 경고
  check_timeout_s: 120

# ─────────────────────────────────────────────────────────────────────────
# transcribe — 회의 전사
# ─────────────────────────────────────────────────────────────────────────
transcribe:
  provider: "groq"           # groq | local
  external_ok: false         # true 로 두면 외부 전송 확인을 묻지 않는다 (권장하지 않음)

# access — 기능별로 다룰 사람. **메일 주소만** 적는다.
#   이름·사용자ID 는 조직도와 온톨로지가 정본이므로 여기에 적지 않는다.
#   비우면 운영자 한 사람만 대상이 된다.
access:
  default: []          # 공통 기본값
  calendar: []         # 일정 수집·브리핑 대상
  bridge: []           # 봇 게이트웨이 응답 허용 대상

# install — 설치 환경. 비워 두면 PATH 에서 찾는다.
install:
  python: ""                   # 예: /usr/bin/python3  (Linux·macOS)
  python_windows: ""           # 예: C:\\Python312\\pythonw.exe  (콘솔 창 없이 실행)

# workspace — 작업창을 여는 방법. 비우면 열 폴더만 알려 준다.
#   사람마다 쓰는 도구가 다르므로 기본값을 두지 않는다.
#   `{title}` · `{path}` 를 쓸 수 있다. 참고: 참고/개인_운영환경_패턴.md
workspace:
  open_command: ""

# legacy — 이관 전 시스템이 있는 곳. 이관이 끝나면 지운다.
#   remediate.py 가 옛 게이트·데이터를 찾는 데만 쓴다
legacy:
  root: ""
  mail_output: ""
  mail_scripts: ""        # 옛 트리의 mail_curate.py 위치 (install/remediate.py 만 쓴다)

# state — 하트비트·커서가 쌓이는 곳. 비우면 작업공간 아래.
#   이관 중에는 옛 시스템과 같은 곳을 봐야 게이트가 서비스 상태를 읽는다
state:
  root: ""
